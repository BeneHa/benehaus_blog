---
name       : Build and deploy functions

permissions:
  id-token: write
  contents: read


on         :
  push:
    branches:
      - main
  workflow_dispatch:

jobs       :
  deploy:
    environment: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Resolve Project Dependencies Using Pip
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          rm -rf jekyll _site terraform vendor node_modules .github .git || true

      - name: Create function deployment package
        shell: bash
        run: |
          # include only function app files and installed packages
          PKG=function_package.zip
          rm -f $PKG
          zip -r $PKG host.json requirements.txt getData processData synchronizeToStrava .python_packages || true
          echo "Package contents:" && unzip -l $PKG | sed -n '1,200p'

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: behablogfunction
          package: function_package.zip
          scm-do-build-during-deployment: true
          enable-oryx-build: true

