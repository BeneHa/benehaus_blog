---
name: Build and deploy website

permissions:
  id-token: write
  contents: read

on  :
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    environment: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helaili/jekyll-action@v2
        with:
          jekyll_src: jekyll
          target_path: _site
          build_dir: _site
          build_only: 'true'
      - name: Azure Login
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - name: upload
        run: |
          sudo chmod -R 777 ~/work/benehaus_blog/benehaus_blog/jekyll/_site/_site/
          npm install -g @azure/static-web-apps-cli
          export SWA_CLI_DEPLOYMENT_TOKEN=$(az staticwebapp secrets list --name webpageswa --query "properties.apiKey")
          swa deploy --env production
